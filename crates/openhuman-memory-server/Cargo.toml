[package]
name = "openhuman-memory-server"
version = "0.1.0"
edition = "2021"
description = "Standalone HTTP server for openhuman-memory"

[lib]
name = "openhuman_memory_server"
path = "src/lib.rs"

[[bin]]
name = "openhuman-memory-server"
path = "src/main.rs"

[dependencies]
openhuman-memory = { path = "../openhuman-memory" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
