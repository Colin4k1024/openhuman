[package]
name = "openhuman-memory-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for openhuman-memory via PyO3"

[lib]
name = "openhuman_memory"
crate-type = ["cdylib"]

[dependencies]
openhuman-memory = { path = "../openhuman-memory" }
pyo3 = { version = "0.22", features = ["extension-module"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
chrono = "0.4"
dirs = "5"
