[package]
name = "openhuman-memory"
version = "0.1.0"
edition = "2021"
description = "Standalone memory system: storage, retrieval, embeddings, summarization trees"
license = "MIT"

[dependencies]
openhuman-embeddings = { path = "../openhuman-embeddings" }
openhuman-memory-types = { path = "../openhuman-memory-types" }

aho-corasick = "1"
base64 = "0.22"
dirs = "5"
futures = "0.3"
futures-util = "0.3"
glob = "0.3"
hex = "0.4"
hostname = "0.4"
log = "0.4"
rand = "0.8"
schemars = "0.8"
unicode-normalization = "0.1"
walkdir = "2"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled", "vtab"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

# Optional deps for gated modules
notify = { version = "6", optional = true }
notify-debouncer-mini = { version = "0.4", optional = true }

[features]
__compile_store = []
__full_app = ["notify", "notify-debouncer-mini"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
